name: Build Kernel Module

on:
  push:
    branches: [ oneplus/mt6991_v_15.0.2_ace5_ultra ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev libssl-dev libelf-dev bison flex bc git gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make defconfig
        echo "CONFIG_KERNEL_HACK=m" >> .config
        # 启用必要的内核选项
        echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_MODULE_UNLOAD=y" >> .config
        echo "CONFIG_KALLSYMS=y" >> .config
        echo "CONFIG_KALLSYMS_ALL=y" >> .config
        # 禁用可能引起问题的 KVM 选项
        echo "CONFIG_KVM=n" >> .config
        echo "CONFIG_VHOST_NET=n" >> .config
        make olddefconfig

    - name: Build kernel modules only
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 只编译模块相关部分，避免完整内核编译
        make -j$(nproc) modules_prepare
        make -j$(nproc) modules

    - name: Build specific kernel module
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 单独编译你的模块
        make M=drivers/khack
        echo "✅ 模块编译完成"

    - name: Check module
      run: |
        if [ -f "drivers/khack/hack.ko" ]; then
            echo "✅ 编译成功"
            file drivers/khack/hack.ko
            # 检查模块依赖
            aarch64-linux-gnu-readelf -s drivers/khack/hack.ko | head -20
        else
            echo "❌ 编译失败"
            # 显示构建目录内容以调试
            ls -la drivers/khack/
            exit 1
        fi

    - name: Upload kernel module
      uses: actions/upload-artifact@v4
      with:
        name: wanbai-kernel-module
        path: drivers/khack/hack.ko
