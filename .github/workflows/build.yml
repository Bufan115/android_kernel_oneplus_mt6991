name: Build Kernel Module

on:
  push:
    branches: [ oneplus/mt6991_v_15.0.2_ace5_ultra ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev libssl-dev libelf-dev bison flex bc git gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make defconfig
        echo "CONFIG_KERNEL_HACK=m" >> .config
        # 启用必要的内核选项
        echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_MODULE_UNLOAD=y" >> .config
        echo "CONFIG_KALLSYMS=y" >> .config
        make olddefconfig

    - name: Build kernel module
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make modules_prepare
        make M=drivers/khack
        echo "✅ 模块编译完成"

    - name: Check module dependencies
      run: |
        aarch64-linux-gnu-nm drivers/khack/khack.ko | grep " U " || echo "✅ 没有未解析的符号"

    - name: Upload kernel module
      uses: actions/upload-artifact@v4
      with:
        name: khack-kernel-module
        path: drivers/khack/khack.ko
