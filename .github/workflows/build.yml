name: Build Kernel Module

on:
  push:
    branches: [ oneplus/mt6991_v_15.0.2_ace5_ultra ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev libssl-dev libelf-dev bison flex bc git gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make defconfig
        echo "CONFIG_KERNEL_HACK=m" >> .config
        # 启用必要的内核选项
        echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_MODULE_UNLOAD=y" >> .config
        echo "CONFIG_KALLSYMS=y" >> .config
        echo "CONFIG_KALLSYMS_ALL=y" >> .config
        make olddefconfig

    - name: Build kernel (full build)
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 先完整编译内核，生成 Module.symvers
        make -j$(nproc)

    - name: Build kernel module
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make M=drivers/khack
        echo "✅ 模块编译完成"

    - name: Check module
      run: |
        if [ -f "drivers/khack/hack.ko" ]; then
            echo "✅ 编译成功"
            file drivers/khack/hack.ko
            # 检查模块信息
            aarch64-linux-gnu-nm drivers/khack/hack.ko | grep -E "get_pid_task|_printk" || echo "未找到外部符号是正常的"
        else
            echo "❌ 编译失败"
            ls -la drivers/khack/
            exit 1
        fi

    - name: Upload kernel module
      uses: actions/upload-artifact@v4
      with:
        name: wanbai-kernel-module
        path: drivers/khack/hack.ko
